{% extends 'base.html' %}

{# RF-16: abrir un tema en el foro del curso #}

{% block title %}Abrir tema{% endblock %}

{% block content %}
<div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold mb-1"><i class="bi bi-chat-dots-fill text-primary me-2"></i>Abrir tema</h2>
        <p class="text-muted mb-0">{{ curso.nombre }}</p>
    </div>
    <a href="{{ volver }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Volver al foro
    </a>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body">
        <form method="post" novalidate data-confirmar="¿Publicar este tema? Después no se podrá editar.">
            {% csrf_token %}
            {% include 'administrador/_campos_formulario.html' with una_columna=True %}
            <button type="submit" class="btn btn-primary mt-3"><i class="bi bi-send me-1"></i>Publicar tema</button>
        </form>
    </div>
</div>
{% endblock %}
