<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Panel de administración{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6fb; }
        .navbar-admin { background: linear-gradient(135deg, #1e3c72, #2a5298); }
        .menu-card {
            border: none;
            border-radius: 1rem;
            transition: transform .2s, box-shadow .2s;
        }
        .menu-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 .75rem 1.5rem rgba(0, 0, 0, .15);
        }
        .menu-icon { font-size: 3.5rem; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-admin shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'admin_menu' %}">
                <i class="bi bi-mortarboard-fill me-2"></i>Capacitaciones Online
            </a>
            <div class="d-flex align-items-center text-white">
                <span class="me-3 d-none d-sm-inline">
                    <i class="bi bi-person-circle me-1"></i>{{ user.get_short_name }}
                </span>
                <form method="post" action="{% url 'logout' %}" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
